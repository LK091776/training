<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#eff6ff;color:#1e293b;min-height:100vh;padding:16px}
.card{max-width:540px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #e2e8f0}
.badge{background:#dbeafe;color:#1d4ed8;font-weight:700;font-size:13px;padding:4px 10px;border-radius:20px}
.prog-bg{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog-bar{height:100%;background:#2563eb;transition:width .3s}
h1{font-size:20px;color:#0f172a;margin-bottom:8px}
p.sub{font-size:14px;color:#64748b;margin-bottom:18px;line-height:1.5}
input{width:100%;padding:12px 14px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:15px;margin-bottom:12px;outline:none}
input:focus{border-color:#2563eb}
.q-text{font-size:16px;font-weight:600;line-height:1.55;margin-bottom:16px;white-space:pre-line;color:#0f172a}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border:1.5px solid #e2e8f0;border-radius:12px;background:#fff;font-size:15px;line-height:1.4;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:#2563eb;background:#eff6ff;font-weight:600}
.ltr{min-width:26px;height:26px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#475569}
.sel .ltr{background:#2563eb;color:#fff}
.nav{display:flex;gap:10px;margin-top:18px}
button.btn{flex:1;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.btn-p{background:#2563eb;color:#fff}
.btn-s{background:#f1f5f9;color:#334155}
.btn:disabled{opacity:.45}
.grid-nav{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:18px;padding-top:14px;border-top:1px solid #e2e8f0}
.dot{aspect-ratio:1;border-radius:6px;border:1px solid #cbd5e1;background:#fff;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot.ans{background:#2563eb;color:#fff;border-color:#2563eb}
.dot.cur{outline:2px solid #0f172a;outline-offset:1px}
.score-box{text-align:center;padding:20px 10px}
.score-num{font-size:48px;font-weight:800;color:#2563eb;margin:8px 0}
.rev-item{padding:14px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px;font-size:14px}
.hide{display:none}
</style>

<script>
const D=[["Perhatikan QS. Al-Mujadilah ayat 11 berikut:\n'...يَرْفَعِ اللّٰهُ الَّذِيْنَ اٰمَنُوْا مِنْكُمْ وَالَّذِيْنَ اُوْتُوا الْعِلْمَ دَرَجٰتٍ...'\nKandungan utama dari potongan ayat di atas adalah ...", ["Allah SWT akan mengangkat derajat orang yang beriman dan berilmu", "Perintah untuk senantiasa berbuat adil kepada sesama manusia", "Anjuran untuk saling memberi maaf dan bersabar dalam ujian", "Kewajiban menjalankan ibadah sholat dan menunaikan zakat"], 0], ["Seseorang yang memiliki semangat keilmuan yang tinggi dan memfungsikan ilmunya secara benar akan menunjukkan ciri-ciri khusus. Di antara ciri orang yang berilmu berikut ini yang tepat adalah ...", ["Suka menggurui orang lain agar diakui kepintarannya", "Bersikap rendah hati, kritis, dan ilmunya membawa manfaat bagi sekitar", "Selalu merasa paling benar dan enggan menerima kritik", "Menggunakan pengetahuannya untuk mencari popularitas semata"], 1], ["Saat membaca Al-Qur'an, kita sering menemukan tanda waqaf Lazim (م). Cara membaca yang benar apabila menjumpai tanda waqaf tersebut adalah ...", ["Boleh berhenti dan boleh melanjutkan bacaan", "Harus/wajib berhenti", "Dilarang berhenti", "Diutamakan untuk terus (wasal)"], 1], ["Randi sering merasa malas dan bosan saat mempelajari mata pelajaran umum non-PAI seperti Matematika dan IPA karena menganggapnya tidak penting untuk akhirat. Saran yang paling tepat diberikan kepada Randi sesuai prinsip keutamaan ilmu dalam Al-Qur'an adalah ...", ["Menyarankan Randi fokus pada pelajaran PAI saja agar selamat di akhirat", "Menjelaskan bahwa semua ilmu yang bermanfaat untuk kebaikan hidup di dunia juga bernilai ibadah", "Meminta Randi keluar dari sekolah umum dan masuk lembaga non-formal", "Membiarkan Randi karena setiap orang bebas memilih pelajaran yang disukai"], 1], ["Perhatikan beberapa aktivitas siswa di sekolah berikut:\n(1) Mengikuti diskusi kelompok belajar dengan aktif\n(2) Membaca buku literasi di perpustakaan saat jam istirahat\n(3) Menyontek jawaban teman saat ujian berlangsung\n(4) Mengkritik pendapat teman tanpa argumentasi yang jelas\nPerilaku yang mencerminkan semangat keilmuan ditunjukkan oleh nomor ...", ["(1) dan (2)", "(1) dan (3)", "(2) dan (4)", "(3) dan (4)"], 0], ["Dalam sebuah forum diskusi ilmiah, terjadi perbedaan pendapat antara dua kelompok penuntut ilmu mengenai suatu masalah hukum fiqih. Sikap terbaik pencari ilmu dalam menyikapi perbedaan pendapat secara ilmiah adalah ...", ["Memutus tali silaturahmi dengan kelompok yang berbeda pandangan", "Mengedepankan tabayyun, menghormati argumen berdasar dalil, dan tidak saling menghujat", "Memaksa kelompok lain untuk mengikuti pendapat kelompoknya", "Melaporkan perbedaan pendapat tersebut kepada pihak berwajib"], 1], ["Perhatikan potongan ayat berikut:\n'...فَارْجِعِ الْبَصَرَۙ هَلْ تَرٰى مِنْ فُطُوْرٍ'\nTanda waqaf yang terdapat pada akhir kata 'فُطُوْرٍ' jika ditandai dengan tanda waqaf Jaiz (ج) berarti ...", ["Waqaf Lazim", "Waqaf Jaiz (boleh berhenti atau boleh terus)", "Waqaf Mamnu' (dilarang berhenti)", "Waqaf Muraqabah"], 1], ["Ahmad belajar dengan cara menghafal tanpa memahami konsep dan cepat merasa puas, sedangkan Bilal belajar dengan cara menganalisis konsep, membaca berbagai sumber, serta mengaitkan ilmu dengan kehidupan nyata. Perbandingan dampak metode belajar Bilal terhadap pembentukan karakternya adalah ...", ["Bilal menjadi siswa yang lebih kritis, berwawasan luas, dan bijaksana dalam mengambil keputusan", "Bilal menjadi pribadi yang sombong karena merasa tahu segala hal", "Ahmad akan lebih unggul dalam penerapan moral dibanding Bilal", "Tidak ada perbedaan karakter yang signifikan antara Ahmad dan Bilal"], 0], ["Dalam sebuah majelis ilmu, panitia melapangkan tempat duduk bagi para jamaah yang baru datang dan para jamaah menyambutnya dengan ramah serta saling menghormati. Aktivitas ini sangat sesuai dengan perintah Allah SWT dalam QS. Al-Mujadilah ayat 11, yaitu ...", ["Perintah mendirikan sholat berjamaah di shaf terdepan", "Perintah memberi kelapangan dan penghormatan dalam majelis ilmu", "Larangan bersuara keras saat pengajian berlangsung", "Kewajiban menyantuni anak yatim yang hadir di majelis"], 1], ["Maraknya informasi hoaks dan penurunan tingkat literasi mendalam akibat penggunaan media sosial yang tidak terkontrol menjadi tantangan pelajar saat ini. Solusi terbaik berdasarkan nilai-nilai ajaran Islam tentang semangat keilmuan adalah ...", ["Menutup semua akses internet dan media sosial di lingkungan sekolah", "Mengembangkan kebiasaan tabayyun (verifikasi informasi) dan literasi digital berbasis etika Islam", "Mengabaikan semua informasi yang berasal dari media sosial tanpa terkecuali", "Membiarkan siswa mencari informasi bebas tanpa bimbingan"], 1], ["Bencana alam berupa tanah longsor, gempa bumi lokal, serta meninggalnya seorang manusia merupakan peristiwa kehancuran sebagian alam yang disebut kiamat ...", ["Kubra", "Sughra", "Wustha", "Ula"], 1], ["Hari Kiamat memiliki beberapa nama lain yang menggambarkan peristiwa pada hari tersebut. Nama lain kiamat yang berarti 'Hari Kebangkitan seluruh manusia dari alam kubur' adalah ...", ["Yaumul Ba'ats", "Yaumul Hisab", "Yaumul Mizan", "Yaumul Jaza'"], 0], ["Perhatikan pasangan nama lain hari kiamat dan artinya berikut!\n(1) Yaumul Mahsyar - Hari berkumpulnya manusia\n(2) Yaumul Mizan - Hari perhitungan amal\n(3) Yaumul Jaza' - Hari pembalasan amal\n(4) Yaumul Hisab - Hari pertimbangan amal\nPasangan nama lain kiamat dan arti yang BENAR ditunjukkan oleh nomor ...", ["(1) dan (3)", "(1) dan (2)", "(2) dan (4)", "(3) dan (4)"], 0], ["Di antara tanda-tanda berikut, yang termasuk tanda kecil (sughra) akan datangnya hari kiamat adalah ...", ["Terbitnya matahari dari sebelah barat", "Munculnya Dajjal yang menyebarkan fitnah besar", "Banyaknya jumlah wanita dibandingkan pria dan merajalelanya kebodohan agama", "Turunnya Nabi Isa AS untuk menegakkan keadilan"], 2], ["Peristiwa kehancuran alam semesta pada hari kiamat digambarkan seperti manusia yang bertebaran dan gunung-gunung seperti bulu yang dihambur-hamburkan. Peristiwa ini dijelaskan dalam Al-Qur'an surah ...", ["QS. Al-Qari'ah ayat 1-5", "QS. Al-Zalzalah ayat 1-3", "QS. Yasin ayat 12", "QS. Al-Baqarah ayat 255"], 0], ["Seorang pelajar yang memiliki kesadaran tinggi terhadap Yaumul Hisab (Hari Perhitungan) akan mencerminkan perilaku ...", ["Berhati-hati dalam bertindak dan senantiasa mengevaluasi amalnya sehari-hari", "Belajar hanya ketika mendekati waktu ujian sekolah", "Menghabiskan waktu untuk bermain game online sepanjang malam", "Menolong teman hanya jika diberi imbalan uang"], 0], ["Gaya hidup hedonisme (mengagungkan kenikmatan duniawi dan hura-hura) kini marak di kalangan remaja. Jika dihubungkan dengan keimanan kepada hari akhir, penyebab utama munculnya sikap ini adalah ...", ["Kurangnya uang saku dari orang tua", "Lemahnya keyakinan bahwa kehidupan dunia bersifat sementara dan ada pertanggungjawaban di akhirat", "Pengaruh perkembangan teknologi transportasi", "Banyaknya tempat hiburan di kota-kota besar"], 1], ["Dani dan Riko sama-sama mengalami kegagalan saat mendaftar beasiswa. Dani mengamuk dan putus asa, sedangkan Riko bersabar dan terus berdoa. Analisis yang tepat mengenai pengaruh iman kepada hari akhir pada kedua remaja tersebut adalah ...", ["Riko memiliki iman akhirat yang kuat sehingga meyakini setiap cobaan ada balasan pahala dan takdir terbaik dari Allah", "Dani lebih cerdas dibanding Riko karena mengekspresikan emosinya secara terbuka", "Kedua remaja tersebut tidak dipengaruhi oleh tingkat keimanan mereka", "Riko bersikap pasrah karena malas berusaha kembali"], 0], ["Meskipun undang-undang hukum dan kamera CCTV sudah dipasang di berbagai tempat, kejahatan seperti korupsi dan pencurian tetap marak terjadi. Evaluasi yang paling tepat mengenai efektivitas iman kepada hari akhir sebagai kontrol diri adalah ...", ["Hukum duniawi jauh lebih efektif dibanding keyakinan agama", "Iman kepada hari akhir menciptakan pengawasan internal (muraqabah) bahwa Allah dan malaikat selalu mencatat amal, yang tidak bisa dihindari oleh CCTV", "Keyakinan hari akhir tidak ada hubungannya dengan tingkat kejahatan masyarakat", "Pengawasan CCTV perlu diganti sepenuhnya dengan sanksi adat"], 1], ["Faris menemukan sebuah dompet berisi uang tunai jutaan rupiah di halaman sekolah. Ia sangat membutuhkan uang untuk membeli buku, namun ia memilih menyerahkan dompet itu ke guru Bimbingan Konseling. Penilaian terhadap tindakan Faris berdasarkan hikmah iman kepada hari akhir adalah ...", ["Faris bertindak rugi karena melewatkan kesempatan mendapat uang", "Faris bertindak benar karena meyakini bahwa kejujuran di dunia akan membuahkan keberkahan dan pahala di akhirat", "Faris bersikap ragu-ragu karena takut ditangkap polisi", "Faris hanya mencari pujian dari guru BK"], 1], ["Ajaran Islam sangat menekankan anjuran untuk menebar kasih sayang kepada seluruh alam (rahmatan lil 'alamin). Maksud dari anjuran tersebut adalah ...", ["Bersikap baik hanya kepada orang yang seagama saja", "Menyebarkan kebaikan, kedamaian, dan kepedulian kepada manusia, hewan, dan lingkungan", "Membiarkan kejahatan terjadi demi menjaga kerukunan", "Menunjukkan rasa kasih sayang hanya kepada keluarga dekat"], 1], ["Rasulullah SAW bersabda: 'ارْحَمُوْا مَنْ فِي الأَرْضِ يَرْحَمْكُمْ مَنْ فِي السَّمَاءِ' (Sayangilah siapa yang ada di bumi, niscaya yang ada di langit akan menyayangimu). Pesan utama dari hadis tersebut adalah ...", ["Kasih sayang Allah SWT diberikan kepada orang yang mau mengasihi sesama makhluk di bumi", "Penduduk langit hanya menyayangi orang-orang yang kaya di bumi", "Kasih sayang manusia tidak ada dampaknya bagi kehidupan akhirat", "Kita cukup menyayangi diri sendiri agar disayangi Allah"], 0], ["Salah satu bentuk wujud kasih sayang kepada alam sekitar/lingkungan adalah ...", ["Membuang sampah plastik pada tempatnya dan melakukan penghijauan", "Memelihara burung dalam sangkar yang sempit", "Menebang pohon sembarangan untuk membangun gedung", "Mengabaikan hewan liar yang kelaparan"], 0], ["Di kelas IX-A terdapat siswa dari berbagai latar belakang suku, budaya, dan tingkat ekonomi. Penerapan kasih sayang yang benar dalam situasi perbedaan tersebut adalah ...", ["Membuat kelompok belajar khusus berdasarkan tingkat ekonomi", "Berteman dengan siapa saja tanpa membeda-bedakan serta menghargai perbedaan", "Acuh tak acuh terhadap teman yang berbeda suku", "Mengunggulkan suku sendiri di depan teman-teman"], 1], ["Ketika mendengar rumah seorang teman sekelas terbakar, bentuk empati dan kasih sayang yang konkret dan tepat dilakukan oleh teman-teman sekelasnya adalah ...", ["Mengucapkan duka cita di media sosial saja", "Menggalang dana, pakaian layak pakai, dan memberikan dukungan moral secara langsung", "Datang menonton lokasi kebakaran tanpa memberikan bantuan", "Meminta guru meliburkan sekolah"], 1], ["Fenomena perundungan (bullying) fisik maupun verbal masih terjadi di beberapa sekolah. Langkah pencegahan yang paling berlandaskan prinsip kasih sayang adalah ...", ["Membalas pelaku perundungan dengan tindakan yang sama kerasnya", "Membudayakan sikap saling menghormati, mengedukasi empati, dan merangkul siswa yang terisolasi", "Mengeluarkan seluruh siswa yang terlibat perundungan tanpa pembinaan", "Membiarkan perundungan sebagai bentuk pendewasaan mental"], 1], ["Terjadi perselisihan antara dua kelompok pelajar hanya karena saling ejek di media sosial. Akar masalah dan solusi berbasis prinsip rahmah (kasih sayang) adalah ...", ["Akar masalah: krisis rasa hormat; Solusi: mediasi damai, saling memaafkan, dan tabayyun", "Akar masalah: kurangnya jam pelajaran; Solusi: menambah jam ujian", "Akar masalah: fasilitas sekolah; Solusi: memperbaiki bangunan sekolah", "Akar masalah: perbedaan pendapat; Solusi: membubarkan kedua kelompok"], 0], ["Masyarakat A memberikan bantuan sembako hanya kepada warga yang memilih calon kepala desa tertentu, sedangkan Masyarakat B memberikan bantuan bencana kepada seluruh korban tanpa melihat latar belakang politik/agama. Dasar pembeda kedua tindakan tersebut berdasarkan prinsip kasih sayang adalah ...", ["Masyarakat A berprinsip kasih sayang universal, Masyarakat B berprinsip pamrih", "Masyarakat B menerapkan kasih sayang sejati yang tulus tanpa diskriminasi, sedangkan Masyarakat A berkepentingan politik", "Kedua masyarakat sama-sama sudah benar dalam bertindak", "Masyarakat A lebih efisien dibanding Masyarakat B"], 1], ["Di suatu kawasan perkotaan, terjadi kasus diskriminasi sosial di mana warga miskin dilarang menggunakan fasilitas umum tertentu. Dampak buruk yang terjadi akibat ketiadaan rasa kasih sayang dalam kasus tersebut adalah ...", ["Terciptanya ketertiban dan kebersihan kota", "Munculnya kecemburuan sosial, keharmonisan retak, dan tingginya potensi konflik horizontal", "Meningkatnya perekonomian daerah tersebut", "Masyarakat menjadi lebih patuh pada aturan"], 1], ["Di sebuah lingkungan tempat tinggal yang heterogen, tetangga yang berbeda agama sedang merayakan hari besarnya. Sikap yang benar berdasarkan prinsip kasih sayang dan toleransi Islam adalah ...", ["Mengganggu jalannya ibadah mereka agar sadar", "Menjaga kerukunan, tidak mengganggu jalannya ibadah, dan tetap bersikap santun dalam kehidupan bermasyarakat", "Mengikuti seluruh ritual ibadah mereka", "Pindah rumah ke pemukiman yang homogen"], 1], ["Memutus saluran pernapasan (hulqum), saluran makanan (mari'), dan dua pembuluh darah (wadajain) pada leher hewan dengan alat yang tajam disebut istilah ...", ["Penyembelihan (Adz-Dzabh)", "Aqiqah", "Kurban", "Berburu"], 0], ["Perhatikan pernyataan berikut!\n(1) Menghadapkan hewan ke arah kiblat\n(2) Membaca basmalah dan shalawat\n(3) Menyembelih dengan pisau yang tumpul agar tidak berdarah banyak\n(4) Memotong dua urat nadi leher hewan hingga putus\nPernyataan yang TIDAK termasuk sunah penyembelihan hewan ditunjukkan oleh nomor ...", ["(1)", "(2)", "(3)", "(4)"], 2], ["Salah satu perbedaan mendasar antara ibadah kurban dan aqiqah terletak pada ...", ["Kurban dilaksanakan kaitannya dengan kelahiran bayi, sedangkan aqiqah dilaksanakan pada bulan Dzulhijjah", "Daging kurban disyariatkan dibagikan dalam kondisi mentah, sedangkan daging aqiqah disunahkan dibagikan setelah dimasak", "Aqiqah wajib menggunakan hewan unta, kurban cukup kambing", "Kurban hukumnya wajib ain, aqiqah hukumnya haram"], 1], ["Pak Ahmad hendak berkurban seekor kambing. Di antara syarat keabsahan hewan kurban yang harus dipenuhi adalah ...", ["Hewan harus bertanduk panjang dan berwarna putih", "Hewan cukup umur (kambing minimal 1 tahun/berganti gigi) dan tidak cacat", "Hewan yang dibeli dengan cara berutang tanpa niat membayar", "Hewan betina yang sedang menyusui anak"], 1], ["Pak Rahmat menyembelih 2 ekor kambing untuk aqiqah atas kelahiran anaknya. Berdasarkan ketentuan fiqih Islam, jumlah 2 ekor kambing tersebut diperuntukkan bagi ...", ["1 orang anak laki-laki", "1 orang anak perempuan", "2 orang anak perempuan", "1 orang anak kembar perempuan"], 0], ["Sebuah rumah potong hewan (RPH) modern menggunakan mesin mekanis untuk menyembelih sapi. Tata cara penyembelihan mekanis dinyatakan SAH menurut fiqih Islam apabila ...", ["Operator mesin membaca basmalah saat menekan tombol dan pisau mekanis memotong 3 saluran utama leher hewan", "Hewan dibuat pingsan permanen sebelum dipotong", "Mesin dijalankan tanpa perlu menyebut nama Allah", "Penyembelihan dilakukan oleh orang yang tidak beragama Islam"], 0], ["Pak Budi berkurban seekor sapi untuk 7 orang keluarganya (bukan kurban nazar). Porsi pembagian daging kurban yang paling sesuai dengan sunah rasul adalah ...", ["1/3 untuk sohibul qurban, 1/3 untuk fakir miskin, dan 1/3 untuk tetangga/kerabat", "Seluruh daging dimakan sendiri oleh keluarga Pak Budi", "Seluruh daging dijual ke pasar untuk mendapatkan uang", "1/2 untuk sohibul qurban dan 1/2 dijual"], 0], ["Panitia kurban di desa surplus memindahkan sebagian distribusi daging kurban yang telah dikemas ke daerah terpencil yang melanda kelaparan dan bencana. Manfaat dan analisis dari pemindahan distribusi ini adalah ...", ["Melanggar hukum kurban karena daging harus habis di desa asal", "Sangat bermanfaat dan tepat sasaran sesuai prinsip pemerataan keadilan sosial dan penanganan krisis pangan", "Mengurangi pahala orang yang berkurban", "Menyebabkan daging kurban menjadi cepat busuk"], 1], ["Bu Sinta membagikan daging aqiqah anaknya dalam bentuk mentah tanpa dimasak terlebih dahulu kepada tetangganya. Evaluasi hukum keabsahan pembagian tersebut berdasarkan fiqih adalah ...", ["Aqiqah menjadi tidak sah dan harus diulang", "Aqiqah tetap SAH, namun menyalahi keutamaan (sunah) karena disunahkan membagikan daging aqiqah yang sudah dimasak manis", "Bu Sinta mendapat dosa besar", "Tetangga wajib mengembalikan daging tersebut"], 1], ["Ada 14 orang warga kelompok pengajian yang ingin menunaikan ibadah kurban secara patungan dengan hewan sapi. Jumlah sapi minimum yang harus disembelih agar mencukupi kurban bagi 14 orang tersebut adalah ...", ["1 ekor sapi", "2 ekor sapi", "3 ekor sapi", "7 ekor sapi"], 1], ["Dinasti Syafawi merupakan salah satu dari Tiga Kerajaan Besar Islam di era modern (bersama Usmani dan Mogul). Nama 'Syafawi' diidentifikasi berasal dari nama pendiri gerakan tarekat dasarnya, yaitu ...", ["Syekh Safiuddin Ardabili", "Shah Ismail I", "Shah Abbas I", "Sultan Selim I"], 0], ["Dinasti Syafawi mencapai puncak kemajuan pesat baik di bidang politik, ekonomi, kebudayaan, maupun arsitektur pada masa pemerintahan khalifah/penguasa ...", ["Shah Ismail I", "Shah Abbas I", "Shah Tahmasp I", "Shah Safi"], 1], ["Pada masa kejayaannya, Dinasti Syafawi berhasil menguasai wilayah strategis yang sekarang dikenal sebagai negara ...", ["Turki", "Iran (Persia) dan sekitarnya", "India", "Mesir"], 1], ["Khalifah Shah Abbas I melakukan reformasi besar dengan membentuk pasukan tentara khusus 'Ghulam' dan memindahkan ibu kota kerajaan ke Isfahan. Tujuan utama langkah kebijakan ini adalah ...", ["Menghancurkan kebudayaan Persia", "Memperkuat stabilitas keamanan, mengikis dominasi suku Qizilbash, dan memajukan perekonomian", "Menghindari peperangan dengan Dinasti Mogul", "Menyerahkan kekuasaan kepada pihak barat"], 1], ["Salah satu ilmuwan filsafat terkemuka pada masa Dinasti Syafawi yang terkenal dengan ajaran filsafat hikmah / Al-Hikmah Al-Muta'aliyah adalah ...", ["Sadra al-Din al-Shirazi (Mulla Sadra)", "Ibn Sina", "Al-Ghazali", "Al-Khawarizmi"], 0], ["Berikut ini yang merupakan faktor utama kemajuan kebudayaan dan ekonomi Dinasti Syafawi adalah ...", ["Perdagangan sutra yang pesat dan keindahan seni arsitektur di kota Isfahan", "Penemuan mesin uap modern", "Penutupan jalur perdagangan internasional", "Kerjasama militer dengan seluruh kerajaan di Eropa"], 0], ["Kemunduran Dinasti Syafawi hingga akhirnya runtuh dipicu oleh faktor utama, yaitu ...", ["Perebutan kekuasaan internal, kepemimpinan raja-raja yang lemah dan dekadensi moral, serta serangan suku Afghan", "Bencana alam gempa bumi yang meratakan Isfahan", "Pengalihan seluruh anggaran negara untuk pendidikan", "Wafatnya Mulla Sadra"], 0], ["Perbandingan antara Dinasti Syafawi dengan Dinasti Usmani dan Mogul menunjukkan bahwa ciri khas utama Dinasti Syafawi adalah ...", ["Menjadikan Syiah sebagai mazhab resmi negara dan menonjol dalam kebudayaan Persia", "Mengembangkan mazhab Syafi'i di wilayah India", "Menguasai seluruh daratan Eropa Tengah", "Menolak segala bentuk seni arsitektur dan lukisan"], 0], ["Adanya konflik internal dan sikap fanatisme mazhab yang berlebihan pada masa akhir pemerintahan Syafawi merusak toleransi dan persatuan. Evaluasi dampak fanatisme sempit terhadap keberlangsungan suatu negara adalah ...", ["Fanatisme memperkuat persatuan nasional", "Fanatisme sempit memicu perpecahan, perlawanan rakyat, dan mempermudah masuknya ancaman luar yang meruntuhkan negara", "Fanatisme memajukan tingkat pendidikan sains", "Tidak berpengaruh apa-apa terhadap stabilitas negara"], 1], ["Kota Isfahan pernah dijuluki 'Isfahan Nisf-e Jahan' (Isfahan Separuh Dunia) karena kemajuan ilmu dan keindahannya. Relevansi hikmah Sejarah Dinasti Syafawi bagi pelajar masa sekarang adalah ...", ["Cukup membanggakan kejayaan masa lalu tanpa perlu belajar", "Pentingnya memadukan ilmu pengetahuan, seni, dan kepemimpinan yang kuat untuk membangun peradaban yang maju", "Menjauhi perkembangan teknologi modern", "Mengagumi bangunan megah saja"], 1]];
let idx=0,ans=Array(D.length).fill(null),sec=0,tmr;
const L=['A','B','C','D'];
function mulai(){
  const n=document.getElementById('nama').value.trim()||'Siswa';
  const k=document.getElementById('kelas').value.trim()||'Kelas 9';
  document.getElementById('res-info').textContent=n+' • '+k;
  document.getElementById('start-scr').classList.add('hide');
  document.getElementById('quiz-scr').classList.remove('hide');
  renderNav();renderQ();
  tmr=setInterval(()=>{sec++;const m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s},1000);
}
function renderNav(){
  const g=document.getElementById('gnav');g.innerHTML='';
  D.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='dot'+(ans[i]!==null?' ans':'')+(i===idx?' cur':'');
    b.textContent=i+1;b.onclick=()=>{idx=i;renderQ()};g.appendChild(b);
  });
}
function renderQ(){
  const [q,opts]=D[idx];
  document.getElementById('q-num').textContent=`Soal ${idx+1} / ${D.length}`;
  document.getElementById('pbar').style.width=`${((idx+1)/D.length)*100}%`;
  document.getElementById('q-txt').textContent=q;
  const box=document.getElementById('opts');box.innerHTML='';
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(ans[idx]===i?' sel':'');
    b.innerHTML=`<span class="ltr">${L[i]}</span><span>${o}</span>`;
    b.onclick=()=>{ans[idx]=i;renderQ()};
    box.appendChild(b);
  });
  document.getElementById('prev-btn').disabled=idx===0;
  const nb=document.getElementById('next-btn');
  nb.textContent=idx===D.length-1?'Selesai & Nilai':'Selanjutnya';
  renderNav();
}
function go(d){
  if(d===1&&idx===D.length-1){
    const belum=ans.filter(x=>x===null).length;
    if(belum>0&&!confirm(`Masih ada ${belum} soal belum dijawab. Yakin ingin mengumpulkan?`))return;
    selesai();return;
  }
  idx=Math.max(0,Math.min(D.length-1,idx+d));renderQ();
}
function selesai(){
  clearInterval(tmr);
  document.getElementById('quiz-scr').classList.add('hide');
  document.getElementById('res-scr').classList.remove('hide');
  let benar=0;
  const rev=document.getElementById('review');rev.innerHTML='<h3 style="margin:14px 0 10px;font-size:16px">Pembahasan & Kunci Jawaban</h3>';
  D.forEach(([q,opts,k],i)=>{
    const u=ans[i],ok=u===k;if(ok)benar++;
    const div=document.createElement('div');div.className='rev-item';
    div.style.borderLeft=`4px solid ${ok?'#16a34a':'#dc2626'}`;
    div.innerHTML=`<div style="font-weight:700;margin-bottom:6px">${i+1}. ${q}</div>
    <div style="color:${ok?'#15803d':'#b91c1c'}">Jawabanmu: <b>${u!==null?L[u]+'. '+opts[u]:'Tidak dijawab'}</b></div>
    ${!ok?`<div style="color:#15803d;margin-top:2px">Kunci: <b>${L[k]}. ${opts[k]}</b></div>`:''}`;
    rev.appendChild(div);
  });
  const nilai=benar*2;
  document.getElementById('skor').textContent=nilai;
  document.getElementById('res-det').textContent=`Benar ${benar} dari ${D.length} soal (Bobot 2 poin/soal) • Waktu ${document.getElementById('timer').textContent}`;
}
function ulang(){
  ans=Array(D.length).fill(null);idx=0;sec=0;
  document.getElementById('res-scr').classList.add('hide');
  document.getElementById('start-scr').classList.remove('hide');
}
</script>
